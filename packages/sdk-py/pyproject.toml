[project]
name = "specstream-client"
version = "1.1.1"
description = "Python client for building lead lists and company lists from the live web. Every match comes with its source, priced before it runs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = [
  "specstream",
  "web-data",
  "live-web",
  "lead-lists",
  "enrichment",
  "monitoring",
  "mcp",
  "ai-agents",
  "api-client",
  "lead-generation",
  "lead-list",
  "company-list",
  "grants",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs/sdk"
API = "https://api.specstream.ai"
Changelog = "https://specstream.ai/changelog"
Repository = "https://github.com/specstream/specstream-tools"
Issues = "https://github.com/specstream/specstream-tools/issues"

[project.scripts]
specstream = "specstream_client.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specstream_client"]

[tool.hatch.build.targets.sdist]
include = ["specstream_client", "tests", "README.md", "LICENSE"]
