[project]
name = "specstream-mcp-stdio"
version = "1.1.0"
description = "Stdio proxy for the SpecStream MCP server, for Zed, Cline, and Continue. Finished lists with sources, priced before they run."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpecStream", email = "support@specstream.ai" }]
keywords = [
  "specstream",
  "mcp",
  "model-context-protocol",
  "stdio",
  "proxy",
  "ai-agents",
  "web-data",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://specstream.ai"
Documentation = "https://specstream.ai/docs/mcp"
Repository = "https://github.com/Specstreamai/specstream-tools"
Issues = "https://github.com/Specstreamai/specstream-tools/issues"

[project.scripts]
specstream-mcp-stdio = "specstream_mcp_stdio.proxy:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specstream_mcp_stdio"]

[tool.hatch.build.targets.sdist]
include = ["specstream_mcp_stdio", "README.md", "LICENSE"]
