name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SDK tests
        working-directory: packages/sdk-py
        run: |
          python -m pip install pytest build
          PYTHONPATH=. python -m pytest -q tests
          python -m build
      - name: LangChain package tests
        working-directory: packages/langchain-specstream
        run: |
          python -m pip install "langchain-core>=0.3,<2" langchain-tests pytest build
          PYTHONPATH=. python -m pytest -q
          python -m build
      - name: LlamaIndex package tests
        working-directory: packages/llama-index-tools-specstream
        run: |
          python -m pip install "llama-index-core>=0.13,<0.15" pytest build
          PYTHONPATH=. python -m pytest -q
          python -m build
      - name: CrewAI package tests
        working-directory: packages/crewai-specstream
        run: |
          python -m pip install "crewai>=1.0,<2" pytest build
          PYTHONPATH=. python -m pytest -q
          python -m build
      - name: Haystack package tests
        working-directory: packages/specstream-haystack
        run: |
          python -m pip install "haystack-ai>=2.14" docstring-parser pytest ruff build
          python -m ruff check .
          python -m pytest -q
          python -m build
      - name: stdio proxy builds
        working-directory: packages/mcp-stdio
        run: python -m build
      - name: GitHub Action tests
        working-directory: actions/find-action
        run: python -m unittest test_run

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK tests
        working-directory: packages/sdk-ts
        run: |
          npm ci
          npm test
      - name: AI SDK package tests
        working-directory: packages/ai-sdk
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: OpenCode plugin check and test
        working-directory: integrations/opencode
        run: |
          npm ci
          npm run check
          npm test
      - name: n8n node lint, build and test
        working-directory: integrations/n8n
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
