# Publishes the n8n community node, the Activepieces piece and the OpenCode and OpenClaw plugins and the Pi package
# to npm with a provenance statement.
#
# n8n only verifies community nodes that are published from GitHub Actions with
# provenance. The workflow file must be named publish.yml if you set up an npm
# Trusted Publisher; otherwise set the NPM_TOKEN repository secret (a granular
# access token with read and write on the packages below).
#
# Run it from the Actions tab, or:  gh workflow run publish.yml -f package=n8n
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options:
          - n8n
          - activepieces
          - opencode
          - openclaw
          - pi
        default: n8n
  push:
    tags:
      - "n8n-v*"
      - "activepieces-v*"
      - "opencode-v*"
      - "openclaw-v*"
      - "pi-v*"

jobs:
  n8n:
    if: inputs.package == 'n8n' || startsWith(github.ref, 'refs/tags/n8n-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm 11.5+ publishes through an npm Trusted Publisher (OIDC) with no token.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: "true"
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  activepieces:
    if: inputs.package == 'activepieces' || startsWith(github.ref, 'refs/tags/activepieces-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/activepieces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  opencode:
    if: inputs.package == 'opencode' || startsWith(github.ref, 'refs/tags/opencode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  openclaw:
    if: inputs.package == 'openclaw' || startsWith(github.ref, 'refs/tags/openclaw-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run plugin:validate
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

  pi:
    if: inputs.package == 'pi' || startsWith(github.ref, 'refs/tags/pi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public
